<!doctype html>
<html>

<head>
	<meta charset="utf-8">
	<title>我爱你</title>
	<meta name="language" content="zh-CN">
	<meta name="github" content="https://github.com/sun0225SUN/Awesome-Love-Code">
	<meta name="describe" content="收集不易，您的star是我坚持的动力，同时也欢迎各位PR哦! ">
	<link rel="icon" type="image/x-icon" href="https://cdn.jsdelivr.net/gh/sun0225SUN/photos/img/20210715233345.png">

	<style>
		html,
		body {
			margin: 0px;
			width: 100%;
			height: 100%;
			overflow: hidden;
			background: #000;
		}

		canvas {
			position: absolute;
			top: 0;
			left: 0;
		}
	</style>
</head>

<body>
	<!-- 烟花效果的画布 -->
	<canvas id="fireworksCanvas" style="z-index: 1;"></canvas>
	<!-- 文字下落效果的画布 -->
	<canvas id="textCanvas" style="z-index: 2;"></canvas>

	<script>
		// 烟花效果的代码
		function initFireworks() {
			const canvas = document.getElementById("fireworksCanvas");
			const ctx = canvas.getContext("2d");
			canvas.width = window.innerWidth;
			canvas.height = window.innerHeight;

			let pi = Math.PI;
			let cx = canvas.width / 2;
			let cy = canvas.height / 2;
			let playerZ = -25;
			let playerX = playerY = playerVX = playerVY = playerVZ = pitch = yaw = pitchV = yawV = 0;
			let scale = 600;
			let seedTimer = 0, seedInterval = 5, seedLife = 100, gravity = 0.02;
			let seeds = [];
			let sparkPics = [];
			let sparks = [];
			let frames = 0;

			// 加载火花图片
			for (let i = 1; i <= 10; i++) {
				let sparkPic = new Image();
				sparkPic.src = `https://cantelope.org/NYE/spark${i}.png`;
				sparkPics.push(sparkPic);
			}

			// 生成种子
			function spawnSeed() {
				let seed = {
					x: -50 + Math.random() * 100,
					y: 25,
					z: -50 + Math.random() * 100,
					vx: 0.1 - Math.random() * 0.2,
					vy: -1.5,
					vz: 0.1 - Math.random() * 0.2,
					born: frames
				};
				seeds.push(seed);
			}

			// 爆炸效果
			function splode(x, y, z) {
				let t = 5 + parseInt(Math.random() * 150);
				let sparkV = 1 + Math.random() * 2.5;
				let type = parseInt(Math.random() * 3);
				let pic1, pic2, pic3;

				switch (type) {
					case 0:
						pic1 = parseInt(Math.random() * 10);
						break;
					case 1:
						pic1 = parseInt(Math.random() * 10);
						do { pic2 = parseInt(Math.random() * 10); } while (pic2 == pic1);
						break;
					case 2:
						pic1 = parseInt(Math.random() * 10);
						do { pic2 = parseInt(Math.random() * 10); } while (pic2 == pic1);
						do { pic3 = parseInt(Math.random() * 10); } while (pic3 == pic1 || pic3 == pic2);
						break;
				}

				for (let m = 1; m < t; m++) {
					let spark = {
						x: x, y: y, z: z,
						vx: Math.sin(Math.random() * 2 * pi) * Math.sin(Math.random() * pi) * sparkV,
						vz: Math.cos(Math.random() * 2 * pi) * Math.sin(Math.random() * pi) * sparkV,
						vy: Math.cos(Math.random() * pi) * sparkV,
						img: sparkPics[type === 0 ? pic1 : type === 1 ? (Math.random() < 0.5 ? pic1 : pic2) : [pic1, pic2, pic3][Math.floor(Math.random() * 3)]],
						radius: 25 + Math.random() * 50,
						alpha: 1,
						trail: []
					};
					sparks.push(spark);
				}
			}

			// 绘制函数
			function drawFireworks() {
				ctx.clearRect(0, 0, canvas.width, canvas.height);

				// 绘制种子
				for (let i = 0; i < seeds.length; i++) {
					let seed = seeds[i];
					seed.vy += gravity;
					seed.x += seed.vx;
					seed.y += seed.vy;
					seed.z += seed.vz;

					if (frames - seed.born > seedLife) {
						splode(seed.x, seed.y, seed.z);
						seeds.splice(i, 1);
						i--;
					}
				}

				// 绘制火花
				for (let i = 0; i < sparks.length; i++) {
					let spark = sparks[i];
					if (spark.alpha > 0 && spark.radius > 5) {
						spark.alpha -= 0.01;
						spark.radius /= 1.02;
						spark.vy += gravity;
						spark.x += spark.vx;
						spark.y += spark.vy;
						spark.z += spark.vz;
						spark.vx /= 1.075;
						spark.vy /= 1.075;
						spark.vz /= 1.075;

						ctx.globalAlpha = spark.alpha;
						ctx.drawImage(spark.img, spark.x - spark.radius / 2, spark.y - spark.radius / 2, spark.radius, spark.radius);
					} else {
						sparks.splice(i, 1);
						i--;
					}
				}
			}

			// 主循环
			function frameFireworks() {
				if (seedTimer < frames) {
					seedTimer = frames + seedInterval * Math.random() * 10;
					spawnSeed();
				}
				drawFireworks();
				frames++;
				requestAnimationFrame(frameFireworks);
			}

			frameFireworks();
		}

		// 文字下落效果的代码
		function initTextEffect() {
			const canvas = document.getElementById("textCanvas");
			const ctx = canvas.getContext("2d");
			canvas.width = window.innerWidth;
			canvas.height = window.innerHeight;

			const fontSize = 16;
			const columns = Math.floor(canvas.width / fontSize);
			const drops = [];
			const str = "LOVE";

			for (let i = 0; i < columns; i++) {
				drops.push(0);
			}

			function draw() {
				ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
				ctx.fillRect(0, 0, canvas.width, canvas.height);
				ctx.font = `700 ${fontSize}px 微软雅黑`;
				ctx.fillStyle = "#FF69B4";

				for (let i = 0; i < columns; i++) {
					const index = Math.floor(Math.random() * str.length);
					const x = i * fontSize;
					const y = drops[i] * fontSize;
					ctx.fillText(str[index], x, y);

					if (y >= canvas.height && Math.random() > 0.99) {
						drops[i] = 0;
					}
					drops[i]++;
				}
			}

			setInterval(draw, 30);
		}

		// 初始化
		initFireworks();
		initTextEffect();
	</script>
	<script src="js/index.js"></script>
</body>

</html>
